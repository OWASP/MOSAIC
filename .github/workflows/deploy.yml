name: Deploy to Live Channel

on:
  push:
    branches:
      - main
    paths:
      - "content/mosaic/**"
      - ".github/workflows/deploy.yml"
      - "package.json"

permissions:
  contents: read
  deployments: write
  checks: write

jobs:
  deploy_live_website:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
          extended: true
      - name: Build
        run: hugo --gc --minify
        working-directory: content/mosaic
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Set live channel release retention
        run: |
          curl -sf -X PATCH \
            "https://firebasehosting.googleapis.com/v1beta1/sites/mozaic-56ca8/channels/live?updateMask=retainedReleaseCount" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{"retainedReleaseCount": 5}'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: mozaic-56ca8
          target: mozaic-56ca8
          channelId: live
          entryPoint: content/mosaic
