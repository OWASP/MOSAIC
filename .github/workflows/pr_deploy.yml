# Build the Hugo site on the pull request. Hosting publish happens in
# preview_publish.yml (workflow_run) so fork PRs never receive deploy secrets.

name: Deploy to Preview Channel

on:
  pull_request:
    paths:
      - "content/mosaic/**"
      - "website/**"
      - ".github/workflows/**"
      - "package.json"

permissions:
  contents: read
  checks: write

jobs:
  build_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Resolve site root
        id: site
        run: |
          if [ -d website ]; then
            echo "root=website" >> "$GITHUB_OUTPUT"
          elif [ -d content/mosaic ]; then
            echo "root=content/mosaic" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find Hugo site root" >&2
            exit 1
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
          extended: true

      - name: Build
        run: hugo --gc --minify
        working-directory: ${{ steps.site.outputs.root }}

      - name: Package preview artifact
        run: |
          root="${{ steps.site.outputs.root }}"
          mkdir -p preview-artifact
          cp "$root/firebase.json" preview-artifact/
          cp "$root/.firebaserc" preview-artifact/
          cp -a "$root/public" preview-artifact/public
          printf '{"pr_number":%s,"sha":"%s"}\n' \
            "${{ github.event.pull_request.number }}" \
            "${{ github.sha }}" > preview-artifact/preview-meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: firebase-preview
          path: preview-artifact
          include-hidden-files: true
          if-no-files-found: error
