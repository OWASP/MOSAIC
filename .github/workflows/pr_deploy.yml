# Preview deploy for PRs. Fork PRs use the production environment so a
# maintainer can approve before secrets are used (see Settings → Environments).

name: Deploy to Preview Channel

on:
  pull_request:
    paths:
      - "content/mosaic/**"
      - ".github/workflows/**"
      - "package.json"

permissions:
  contents: read
  pull-requests: write
  deployments: write
  checks: write

jobs:
  build_and_preview_same_repo:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
          extended: true
      - name: Build
        run: hugo --gc --minify
        working-directory: content/mosaic
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 3d
          projectId: mozaic-56ca8
          target: mozaic-56ca8
          entryPoint: content/mosaic

  build_and_preview_fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
          extended: true
      - name: Build
        run: hugo --gc --minify
        working-directory: content/mosaic
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          expires: 3d
          projectId: mozaic-56ca8
          target: mozaic-56ca8
          entryPoint: content/mosaic
